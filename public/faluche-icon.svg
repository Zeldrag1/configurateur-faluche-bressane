<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="velourGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#222226"/>
      <stop offset="85%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#080809"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="rubanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC143C"/>
      <stop offset="50%" stop-color="#DC143C"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Disque principal de velours -->
  <circle cx="50" cy="50" r="46" fill="url(#velourGrad)" stroke="#6C63FF" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Liseré circulaire interne -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Ruban bicolore sur le velours -->
  <path d="M 47,4 L 47,50 L 15,70" fill="none" stroke="#DC143C" stroke-width="3" stroke-linecap="round"/>
  <path d="M 53,4 L 53,50 L 85,70" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Étoile / Insigne doré au centre -->
  <polygon points="50,40 52.8,47 60,47 54.2,51.5 56.5,58.5 50,54 43.5,58.5 45.8,51.5 40,47 47.2,47"
    fill="url(#goldGrad)" stroke="#8B6508" stroke-width="0.8" filter="url(#shadow)"/>
  
  <!-- Petit point frontal doré -->
  <circle cx="50" cy="10" r="2.5" fill="url(#goldGrad)"/>
</svg>
